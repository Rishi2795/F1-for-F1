name: Check deployment

# Manual: smoke-test a deployed API (see docs/deploy.md). Runs from GitHub's network, so it also
# proves the service is reachable from the public internet.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL (no /api)
        required: true
        default: https://f1-for-f1.onrender.com
      origin:
        description: Frontend origin, to verify CORS
        required: true
        default: https://f1-for-f1.vercel.app
      expect_season:
        description: Latest season that must be published
        required: true
        default: "2026"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check
        env:
          API_URL: ${{ inputs.api_url }}
          ORIGIN: ${{ inputs.origin }}
          SEASON: ${{ inputs.expect_season }}
        run: python scripts/check_deploy.py "$API_URL" --origin "$ORIGIN" --expect-season "$SEASON"
